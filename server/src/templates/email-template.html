<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{heroTitle}} - TigerBug</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; margin: 0; padding: 24px; background: #f8fafc; color: #0f172a; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); overflow: hidden; }
        .header { background: #ffffff; color: #0f172a; padding: 32px 24px; text-align: center; border-bottom: 1px solid #e2e8f0; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 700; color: #0f172a; }
        .header p { margin: 12px 0 0; color: #64748b; font-size: 16px; }
        .content { padding: 32px 24px; }
        .btn { display: inline-block; background: #ea580c; color: #ffffff; padding: 12px 20px; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px; margin: 16px 0; border: 1px solid transparent; transition: all 0.2s ease; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .btn:hover { background: #dc2626; box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1); }
        .content-block { margin-bottom: 28px; }
        .info-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; margin: 20px 0; border-radius: 8px; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .info-box.warning { background: #fefce8; border-color: #facc15; }
        .info-box.success { background: #f0fdf4; border-color: #22c55e; }
        .verification-code { text-align: center; margin: 28px 0; }
        .code-label { font-size: 14px; color: #64748b; margin-bottom: 12px; font-weight: 500; }
        .code-value { font-size: 30px; font-weight: 700; letter-spacing: 5px; color: #ea580c; background: #f8fafc; padding: 18px 24px; border-radius: 10px; display: inline-block; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .divider { text-align: center; margin: 28px 0; position: relative; }
        .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #e2e8f0; }
        .divider-text { background: white; padding: 0 20px; color: #64748b; font-size: 14px; font-weight: 500; position: relative; }
        .cta-section { text-align: center; margin: 28px 0; }
        .footer { background: #f8fafc; color: #64748b; padding: 32px 24px; text-align: center; font-size: 14px; border-top: 1px solid #e2e8f0; }
        .footer a { color: #ea580c; text-decoration: none; margin: 0 12px; font-weight: 500; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{heroTitle}}</h1>
            <p>{{heroSubtitle}}</p>
        </div>
        
        <div class="content">
            {{mainContent}}
            
            {{#if showCta}}
            <div class="cta-section">
                <a href="{{ctaUrl}}" class="btn">{{ctaText}}</a>
            </div>
            {{/if}}
        </div>
        
        <div class="footer">
            <p>© 2025 TigerBug - Bug Tracking Made Simple</p>
            <p>
                <a href="{{baseUrl}}">Visit TigerBug</a> •
                <a href="{{baseUrl}}/support">Support</a> •
                <a href="{{baseUrl}}/privacy">Privacy</a>
            </p>
        </div>
    </div>
</body>
</html>
