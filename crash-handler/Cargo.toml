[package]
name = "crash-handler"
version = "0.1.0"
edition = "2025"

[[bin]]
name = "CrashHandler"
path = "src/main.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"